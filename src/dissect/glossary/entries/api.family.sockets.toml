lang = "es"
summary = "Funciones de Winsock para abrir conexiones de red de bajo nivel, enviar y recibir datos y resolver nombres."
body = "Las usa cualquier programa con red propia. Muchos programas importan ws2_32.dll por ordinal, sin nombres, y esas importaciones no pueden asignarse a esta familia.\n\nMedición del 2026-09-23 sobre 55.035 binarios PE benignos (System32, Program Files y Program Files (x86)): el 2,1 % importa por nombre al menos una función de esta familia.\n\nLa familia es una lista curada y versionada de nombres exactos (dissect-api-families-v1). Dissect solo dice que un nombre importado está en la lista; no interpreta el uso."
not_proven = "Importar funciones de esta familia no demuestra ningún comportamiento: el 2,1 % de los binarios benignos medidos lo hace."
related = ["pe.imports"]
