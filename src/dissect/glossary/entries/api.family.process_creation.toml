summary = "Funciones para lanzar otro programa o abrir un archivo con su aplicación asociada."
body = "Las usan instaladores, actualizadores, lanzadores y cualquier programa que abra otro. También pueden servir para ejecutar comandos o cargas descargadas.\n\nMedición del 2026-09-23 sobre 55.035 binarios PE benignos (System32, Program Files y Program Files (x86)): el 4,8 % importa por nombre al menos una función de esta familia.\n\nLa familia es una lista curada y versionada de nombres exactos (dissect-api-families-v1). Dissect solo dice que un nombre importado está en la lista; no interpreta el uso."
not_proven = "Importar funciones de esta familia no demuestra ningún comportamiento: el 4,8 % de los binarios benignos medidos lo hace."
