id = "api.family.dynamic_loading"
title = "Funciones de carga dinámica de bibliotecas"
revision = "1.0.0"
lang = "es"
summary = "Funciones para cargar una DLL mientras el programa se ejecuta y obtener la dirección de sus funciones."
body = "Son muy comunes: los programas las usan para funciones opcionales, complementos o compatibilidad entre versiones de Windows. También permiten usar funciones que no aparecen en la tabla de imports.\n\nMedición del 2026-09-23 sobre 55.035 binarios PE benignos (System32, Program Files y Program Files (x86)): el 34,8 % importa por nombre al menos una función de esta familia.\n\nLa familia es una lista curada y versionada de nombres exactos (dissect-api-families-v1). Dissect solo dice que un nombre importado está en la lista; no interpreta el uso."
not_proven = "Importar funciones de esta familia no demuestra ningún comportamiento: el 34,8 % de los binarios benignos medidos lo hace."
related = ["pe.imports"]
sources = [
