id = "hash.md5"
title = "MD5"
revision = "1.0.0"
lang = "es"
summary = "MD5 es una función hash de 128 bits. Se incluye porque muchas bases de datos la usan todavía como identificador, pero ya no es resistente a colisiones."
body = "RFC 6151 establece que MD5 ya no es aceptable donde se necesita resistencia a colisiones: se pueden construir dos archivos distintos con el mismo MD5. Por eso la identidad de la muestra en Dissect es el SHA-256, y el MD5 solo sirve como referencia cruzada."
not_proven = "Que dos archivos tengan el mismo MD5 no demuestra que sean el mismo archivo."
related = ["hash.sha256"]
sources = [
  { title = "RFC 1321: The MD5 Message-Digest Algorithm", publisher = "IETF / RFC Editor", url = "https://www.rfc-editor.org/rfc/rfc1321", verified_on = 2026-09-23 },
  { title = "RFC 6151: Updated Security Considerations for MD5", publisher = "IETF / RFC Editor", url = "https://www.rfc-editor.org/rfc/rfc6151", verified_on = 2026-09-23 },
]
