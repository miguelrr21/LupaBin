id = "evidence.confidence"
title = "Observado frente a inferido"
revision = "1.0.0"
lang = "es"
summary = "Dissect separa lo que se lee directamente de los bytes (observed, observado) de lo que se obtiene aplicando una transformación a esos bytes (inferred, inferido)."
body = "Una evidencia observada, como una sección, un import o una cadena, describe bytes y estructuras tal como están en el archivo. Una evidencia inferida, como una decodificación, afirma que unos bytes, transformados con un algoritmo y unos parámetros exactos, producen un texto. Es reproducible, pero no significa que el programa haga esa transformación.\n\nNinguno de los dos niveles es una probabilidad ni una puntuación. Las explicaciones de Dissect heredan el nivel más débil de las evidencias que citan."
related = ["analysis.coverage"]
sources = [
  { title = "Contrato de evidencias: regla principal", publisher = "Proyecto Dissect", document = "docs/evidence-schema.md#regla-principal-no-inventar-datos", verified_on = 2026-09-23 },
]
