id = "yara.match"
title = "Coincidencia YARA"
revision = "1.0.0"
lang = "es"
summary = "Una coincidencia indica que la condición de una regla se cumplió sobre los bytes del archivo, y en qué posiciones aparecieron sus patrones."
body = "Dissect conserva el identificador de la regla, su revisión y los desplazamientos de las cadenas que coincidieron, con los bytes capturados para que se puedan comprobar.\n\nLo que una coincidencia significa lo dice la descripción de esa regla en el catálogo, que incluye lo que no demuestra. Por ejemplo, la presencia conjunta de tres nombres de API no demuestra que se importen ni que se usen."
not_proven = "Una coincidencia no demuestra que el patrón se use, ni una familia, ni intención maliciosa."
related = ["yara.rule"]
sources = [
  { title = "Writing YARA rules", publisher = "Documentación oficial de YARA", url = "https://yara.readthedocs.io/en/stable/writingrules.html", verified_on = 2026-09-23 },
  { title = "Contrato de evidencias: regla principal", publisher = "Proyecto Dissect", document = "docs/evidence-schema.md#regla-principal-no-inventar-datos", verified_on = 2026-09-23 },
]
