id = "attack.t1059_001"
title = "T1059.001: PowerShell"
revision = "1.0.0"
lang = "es"
summary = "Técnica de ejecución de ATT&CK: usar PowerShell, el intérprete de órdenes y scripts incluido en Windows, para ejecutar órdenes o scripts."
body = "Dissect asocia esta técnica cuando el programa que lanza una llamada (WinExec, CreateProcess o ShellExecute) es powershell o pwsh, con o sin .exe, según su argumento constante: el nombre de la aplicación, el principio de la línea de órdenes o el archivo que se abre."
not_proven = "Administradores, instaladores y herramientas legítimas lanzan PowerShell a diario."
related = ["attack.technique", "api.family.process_creation"]
