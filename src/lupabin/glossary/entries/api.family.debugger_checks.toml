id = "api.family.debugger_checks"
title = "Funciones de comprobación de depuradores"
revision = "1.0.0"
lang = "es"
summary = "Funciones que indican si el proceso está siendo depurado, o que envían mensajes al depurador."
body = "IsDebuggerPresent la incluye el runtime de C de Microsoft en muchísimos programas. También puede usarse para cambiar de comportamiento cuando alguien analiza el programa.\n\nMedición del 2026-09-23 sobre 55.035 binarios PE benignos (System32, Program Files y Program Files (x86)): el 32,2 % importa por nombre al menos una función de esta familia.\n\nLa familia es una lista curada y versionada de nombres exactos (lupabin-api-families-v1). LupaBin solo dice que un nombre importado está en la lista; no interpreta el uso."
not_proven = "Importar funciones de esta familia no demuestra ningún comportamiento: el 32,2 % de los binarios benignos medidos lo hace."
related = ["pe.imports"]
