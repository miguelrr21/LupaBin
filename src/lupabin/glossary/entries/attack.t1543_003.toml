id = "attack.t1543_003"
title = "T1543.003: servicio de Windows"
revision = "1.0.0"
lang = "es"
summary = "Técnica de persistencia de ATT&CK: crear o modificar un servicio de Windows para que ejecute un programa, por ejemplo cada vez que arranca el sistema."
body = "Un servicio guarda en el registro la ruta de su ejecutable y cómo se inicia; con SERVICE_AUTO_START, el administrador de servicios lo arranca con Windows. ATT&CK cita CreateServiceW entre las funciones que se usan para crearlos.\n\nLupaBin asocia esta técnica a una llamada a CreateService cuyo nombre de servicio o ruta del binario conoce."
not_proven = "Instaladores, controladores y herramientas de administración legítimos crean servicios."
related = ["attack.technique", "api.family.services"]
sources = [
