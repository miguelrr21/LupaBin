id = "api.family.process_memory"
title = "Funciones de memoria de otros procesos"
revision = "1.0.0"
lang = "es"
summary = "Funciones para abrir otro proceso y leer, reservar, proteger o escribir memoria en él, o crear un hilo que se ejecute dentro de él."
body = "Las usan depuradores, perfiladores, herramientas de accesibilidad y de seguridad. También son las piezas clásicas de la inyección de código en otro proceso, por eso los analistas se fijan en ellas.\n\nMedición del 2026-09-23 sobre 55.035 binarios PE benignos (System32, Program Files y Program Files (x86)): el 3,7 % importa por nombre al menos una función de esta familia.\n\nLa familia es una lista curada y versionada de nombres exactos (lupabin-api-families-v1). LupaBin solo dice que un nombre importado está en la lista; no interpreta el uso."
not_proven = "Importar funciones de esta familia no demuestra ningún comportamiento: el 3,7 % de los binarios benignos medidos lo hace."
related = ["pe.imports"]
