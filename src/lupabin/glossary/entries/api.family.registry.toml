id = "api.family.registry"
title = "Funciones del registro de Windows"
revision = "1.0.0"
lang = "es"
summary = "Funciones para abrir, crear, leer, escribir y borrar claves y valores del registro de Windows."
body = "El registro guarda la configuración de Windows y de los programas, así que estas funciones son habituales. También se usan para la persistencia (arrancar con el sistema) o para cambiar configuraciones.\n\nMedición del 2026-09-23 sobre 55.035 binarios PE benignos (System32, Program Files y Program Files (x86)): el 10,6 % importa por nombre al menos una función de esta familia.\n\nLa familia es una lista curada y versionada de nombres exactos (lupabin-api-families-v1). LupaBin solo dice que un nombre importado está en la lista; no interpreta el uso."
not_proven = "Importar funciones de esta familia no demuestra ningún comportamiento: el 10,6 % de los binarios benignos medidos lo hace."
related = ["pe.imports"]
