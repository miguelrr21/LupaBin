id = "entropy.shannon"
title = "Entropía de bytes (Shannon)"
revision = "1.0.0"
lang = "es"
summary = "La entropía mide, de 0 a 8 bits por byte, lo uniforme que es la distribución de valores de los bytes: 0 si todos son iguales y cerca de 8 si los 256 valores aparecen con la misma frecuencia."
body = "LupaBin calcula H = −Σ p·log2(p) sobre los bytes en disco de cada sección, donde p es la frecuencia de cada uno de los 256 valores posibles. Es la medida de información definida por Claude Shannon en 1948, aplicada a bytes.\n\nEl texto y el código máquina suelen quedar muy por debajo de 8. Los datos comprimidos o cifrados se acercan a 8, porque sus bytes son casi uniformes. Por eso la entropía alta es un indicio que se mira al buscar empaquetado (programas comprimidos o cifrados que se descomprimen al ejecutarse).\n\nPero muchos datos legítimos también tienen entropía alta: imágenes, recursos comprimidos, certificados o tablas precalculadas. Y una sección pequeña da una medida poco fiable, porque hay pocos bytes para estimar las frecuencias."
not_proven = "Una entropía alta no demuestra empaquetado, cifrado ni intención maliciosa; una baja tampoco demuestra que no lo haya."
related = ["pe.section"]
