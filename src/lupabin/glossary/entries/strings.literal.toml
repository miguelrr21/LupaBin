id = "strings.literal"
title = "Cadenas literales (ASCII y UTF-16LE)"
revision = "1.0.0"
lang = "es"
summary = "Una cadena literal es una secuencia de bytes que forman texto legible dentro del archivo. LupaBin busca texto ASCII imprimible codificado de dos formas: un byte por carácter (ASCII) y dos bytes por carácter (UTF-16LE)."
body = "ASCII codifica cada carácter con un byte. Windows representa internamente el texto Unicode en UTF-16, con dos bytes por carácter en el orden little-endian (primero el byte menos significativo): la «A» se guarda como 41 00. Por eso muchas cadenas de binarios de Windows aparecen con ceros intercalados.\n\nLupaBin conserva el desplazamiento exacto y los bytes de cada cadena, de modo que cualquiera puede comprobarlos. Solo reconoce caracteres imprimibles del rango ASCII (U+0020–U+007E) y secuencias de al menos cuatro caracteres. No recupera texto en otros alfabetos, cadenas cifradas ni cadenas que el programa construye en memoria.\n\nUna cadena es un dato, no una instrucción ni una acción: que aparezca una URL o una ruta no significa que el programa se conecte a ella o cree ese archivo."
not_proven = "Una cadena no demuestra que el programa la use: puede venir de una biblioteca incluida, de un mensaje nunca mostrado o de datos de relleno."
related = ["decode.base64", "decode.xor"]
sources = [
