id = "decode.hex"
title = "Hexadecimal (Base16)"
revision = "1.0.1"
lang = "es"
summary = "La codificación hexadecimal representa cada byte con dos caracteres de 0–9 y a–f. «48656c6c6f» es «Hello»."
body = "RFC 4648 la define como Base16. LupaBin exige una longitud par de al menos 8 caracteres, rechaza las cadenas formadas solo por dígitos decimales (un número como 2147483647 también es hexadecimal válido) y exige que el resultado sea texto imprimible y variado."
not_proven = "Que un texto decodifique limpiamente no demuestra que el programa lo decodifique ni que lo use."
related = ["evidence.confidence", "decode.base64"]
