id = "decode.xor"
title = "XOR con clave repetida"
revision = "1.0.0"
lang = "es"
summary = "XOR (o exclusivo) es una operación bit a bit: 0⊕0=0, 0⊕1=1, 1⊕0=1 y 1⊕1=0. Aplicar XOR con una clave de unos pocos bytes, repetida a lo largo del texto, es una forma sencilla y frecuente de ocultar cadenas."
body = "Si c = p ⊕ k, entonces p = c ⊕ k: la misma operación con la misma clave cifra y descifra. Con una clave repetida de L bytes, el byte i se combina con el byte i mod L de la clave.\n\nLupaBin no prueba claves al azar ni elige la que «parece» dar texto. Localiza regiones donde, bajo alguna clave de 1 a 8 bytes, aparecería exactamente una cadena de referencia de su catálogo (una crib), deriva la clave de los propios bytes y la comprueba. El resultado incluye la clave, la región y la crib que lo ancló, para que cualquiera pueda repetir la operación.\n\nMITRE ATT&CK recoge la ofuscación con XOR y Base64 entre las técnicas habituales para ocultar texto. Pero ofuscar no es exclusivo del malware: el software comercial también ofusca cadenas, por ejemplo para proteger licencias."
not_proven = "Que unos bytes descifren a texto con una clave no demuestra que el programa haga esa operación ni que use el texto."
related = ["decode.crib", "decode.key_reuse", "evidence.confidence"]
sources = [
