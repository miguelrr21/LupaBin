id = "evidence.confidence"
title = "Observado frente a inferido"
revision = "1.2.1"
lang = "es"
summary = "LupaBin separa lo que se lee directamente de los bytes (observed, observado) de lo que se obtiene aplicando a esos bytes un método exacto, como una transformación o una regla del recorrido del código (inferred, inferido)."
body = "Una evidencia observada, como una sección, un import, una cadena o una llamada del código, describe bytes y estructuras tal como están en el archivo. Una evidencia inferida depende además de un método. Una decodificación afirma que unos bytes, transformados con un algoritmo y unos parámetros exactos, producen un texto. Un argumento constante afirma que una instrucción anterior a la llamada, en el mismo tramo de código, fija ese valor y que el recorrido no vio nada que lo cambie. Las dos son reproducibles, pero no significan que el programa haga esa transformación ni que la llamada se ejecute con ese valor.\n\nNinguno de los dos niveles es una probabilidad ni una puntuación. Las explicaciones de LupaBin heredan el nivel más débil de las evidencias que citan."
related = ["analysis.coverage"]
sources = [
  { title = "Contrato de evidencias: regla principal", publisher = "Proyecto LupaBin", document = "docs/evidence-schema.md#regla-principal-no-inventar-datos", verified_on = 2026-09-23 },
  { title = "Contrato de evidencias: estructura del informe", publisher = "Proyecto LupaBin", document = "docs/evidence-schema.md#estructura-del-informe", verified_on = 2026-09-25 },
]
