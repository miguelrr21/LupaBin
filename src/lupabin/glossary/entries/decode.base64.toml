id = "decode.base64"
title = "Base64"
revision = "1.0.0"
lang = "es"
summary = "Base64 representa datos binarios con 64 caracteres imprimibles (A–Z, a–z, 0–9, + y /), cada uno con 6 bits, y usa «=» como relleno al final."
body = "Cada 3 bytes de datos se convierten en 4 caracteres. Si los datos no son múltiplo de 3 bytes, se añaden uno o dos «=» al final. Un codificador conforme pone a cero los bits de relleno, así que cada dato tiene una sola codificación canónica.\n\nLupaBin solo acepta Base64 estricto: alfabeto estándar, longitud múltiplo de 4, codificación canónica y un resultado de texto imprimible y variado. Así evita confundir identificadores de código con datos codificados; los mínimos se fijaron midiendo sobre binarios benignos.\n\nBase64 no es cifrado: no tiene clave y cualquiera puede revertirlo."
not_proven = "Que un texto decodifique limpiamente no demuestra que el programa lo decodifique ni que lo use."
related = ["evidence.confidence", "decode.hex"]
sources = [
