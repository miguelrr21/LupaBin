id = "code.import_call"
title = "Llamada a una función importada"
revision = "1.0.0"
lang = "es"
summary = "Una instrucción del código que llama a una función de otra DLL a través de su casilla en la tabla de direcciones de import (IAT), donde el cargador escribe la dirección real de la función."
body = "El compilador genera estas llamadas de tres formas habituales, que LupaBin reconoce por sus bytes: directa (`call [casilla]`), a través de un pequeño trampolín o thunk (un `call` a una instrucción `jmp [casilla]`) y por registro (`mov registro, [casilla]` justo antes de `call registro`). Cualquier otra forma no se reconoce.\n\nLupaBin recorre el código sin ejecutarlo. Parte del punto de entrada, de los exports, de los callbacks TLS y, en x64, de las funciones que declara la tabla de excepciones (`.pdata`), y sigue los saltos y llamadas cuyo destino es una constante. El código al que solo se llega por saltos indirectos no se recorre.\n\nEl análisis estático puede afirmar que el código contiene la llamada, no que se ejecute: eso depende de condiciones, entradas y del entorno. Un binario empaquetado o cifrado solo muestra el código de su desempaquetador hasta que se ejecuta."
not_proven = "Que el código contenga una llamada no demuestra que se ejecute ni con qué fin; que no aparezca no demuestra que el programa no llame a la función."
related = ["pe.imports", "pe.imports.runtime_linking"]
sources = [
