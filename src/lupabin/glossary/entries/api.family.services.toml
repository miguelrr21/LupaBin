summary = "Funciones del administrador de servicios para crear, abrir, iniciar, controlar y borrar servicios."
body = "Las usan instaladores y herramientas de administración. Un servicio arranca con el sistema, por eso también se usan para la persistencia.\n\nMedición del 2026-09-23 sobre 55.035 binarios PE benignos (System32, Program Files y Program Files (x86)): el 1,7 % importa por nombre al menos una función de esta familia.\n\nLa familia es una lista curada y versionada de nombres exactos (lupabin-api-families-v1). LupaBin solo dice que un nombre importado está en la lista; no interpreta el uso."
not_proven = "Importar funciones de esta familia no demuestra ningún comportamiento: el 1,7 % de los binarios benignos medidos lo hace."
