id = "decode.crib"
title = "Crib (texto de referencia)"
revision = "1.0.1"
lang = "es"
summary = "Una crib es un fragmento de texto que se espera encontrar, como «http://» o «kernel32.dll». Buscarla bajo una clave desconocida permite localizar texto cifrado y deducir la clave sin probarlas todas."
body = "Si c[i] = p[i] ⊕ k[i mod L], entonces c[i] ⊕ c[i+L] = p[i] ⊕ p[i+L]: la combinación de dos bytes separados L posiciones no depende de la clave. LupaBin busca esa «huella» de cada crib en el archivo; donde aparece, deriva la clave y la verifica byte a byte.\n\nUna crib larga verifica claves más largas: con n bytes solo puede verificar por sí sola claves de hasta unos n−5 bytes. Las cribs forman un catálogo versionado de cadenas neutrales (nombres de DLL, protocolos, rutas) elegidas por su longitud y su frecuencia, no por su significado."
not_proven = "Encontrar una crib dentro de un texto descifrado no demuestra ninguna capacidad: es solo el ancla que permitió encontrarlo."
related = ["decode.xor"]
sources = [
  { title = "Cómo trabaja LupaBin: XOR anclado por diferenciales", publisher = "Proyecto LupaBin", document = "docs/metodo.md#xor-anclado-por-diferenciales", verified_on = 2026-09-25 },
]
