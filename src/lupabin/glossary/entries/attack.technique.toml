id = "attack.technique"
title = "MITRE ATT&CK: tácticas y técnicas"
revision = "1.0.0"
lang = "es"
summary = "ATT&CK es una base de conocimiento pública de MITRE sobre el comportamiento de los atacantes. Una táctica es el objetivo (el porqué) y una técnica, la forma de conseguirlo (el cómo)."
body = "Cada técnica tiene un identificador, como T1547.001, y una página con su definición, ejemplos y formas de detectarla. Las subtécnicas llevan un punto y tres cifras.\n\nLupaBin solo asocia una técnica a una capacidad cuando el mecanismo del caso coincide con la definición de la técnica: escribir un valor en una clave Run es T1547.001. No la asocia por parecido. Abrir esa clave para escribir no escribe nada; la memoria ejecutable y escribible no es, por sí sola, inyección de código; y lanzar rundll32 no es, por sí solo, su abuso para ejecutar código de forma encubierta.\n\nLas técnicas describen lo que hacen los atacantes, pero los mismos mecanismos los usan a diario programas legítimos."
not_proven = "Coincidir con una técnica no demuestra intención: muchos programas legítimos usan el mismo mecanismo."
related = ["capability.static"]
sources = [
