id = "capability.static"
title = "Capacidad (en LupaBin)"
revision = "1.1.0"
lang = "es"
summary = "Una frase sobre lo que contiene el código, construida con llamadas a funciones importadas y sus argumentos constantes: por ejemplo, una llamada que crea un servicio con un nombre y un binario concretos."
body = "LupaBin reúne las llamadas y los argumentos que el informe ya verifica y comprueba si cumplen la condición de una capacidad de su catálogo versionado (lupabin-capabilities-v4). Cada capacidad cita todas las llamadas del informe que la cumplen, con todos sus argumentos publicados, y se vuelve a derivar al validar la explicación. Es una inferencia, porque los argumentos lo son.\n\nLa condición es estricta a propósito: si falta un argumento que hace falta, o un valor no es uno de los documentados, LupaBin no reconoce la capacidad antes que arriesgarse a una frase falsa. Tampoco afirma lo que no sabe: si no conoce la raíz de una clave del registro o el proceso de destino, lo dice.\n\nCasi todas las capacidades son de una sola llamada. Solo se encadenan llamadas al abrir una clave Run o Winlogon y escribir en ella con RegSetValueEx: cuando el identificador de la clave pasa por una variable local en un camino recto o, solo en x64, cuando las dos llamadas están en el mismo rango de función que declara .pdata; en ese caso no se sabe si la escritura usa la clave abierta. Otras combinaciones de llamadas no se reconocen."
not_proven = "Una capacidad no demuestra que el programa haga eso ni con qué intención: depende de que la llamada se ejecute, y muchos programas legítimos contienen las mismas llamadas. Que no aparezca ninguna no demuestra que no las haya."
related = ["code.call_argument", "code.import_call", "attack.technique"]
