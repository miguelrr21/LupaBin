repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Mypy
        entry: uv run --frozen mypy src
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy-linux
        name: Mypy (Linux)
        entry: uv run --frozen mypy --platform linux src
        language: system
        pass_filenames: false
        types: [python]
      - id: web-seo-and-hygiene
        name: Web SEO, attribution, docs links & source hygiene
        entry: uv run --frozen pytest -q tests/test_source_hygiene.py tests/test_attribution.py tests/test_docs_links.py tests/test_web.py
        language: system
        pass_filenames: false
        always_run: true
      - id: web-js-tests
        name: Web JavaScript tests
        entry: node --test --test-concurrency=1 tests/test_web_vt.cjs tests/test_web_challenge.cjs tests/test_web_ghidra.cjs tests/test_web_report.cjs tests/test_web_example.cjs
        language: system
        pass_filenames: false
        files: ^(src/lupabin/web/static/|tests/test_web.*\.cjs$)
