name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup uv v6.0.1
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy src
      - run: uv run --frozen pytest -m "not docker"
      - run: node --test tests/test_web_vt.cjs tests/test_web_challenge.cjs tests/test_web_ghidra.cjs
      - run: uv run --frozen python -m lupabin.evidence.schema --check
      - run: uv run --frozen python -m lupabin.explain.schema --check
      - run: uv build
      - run: uv run --frozen python -m tests.check_yara_distribution

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup uv v6.0.1
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca
        with:
          version: "0.8.22"
      - run: uv sync --frozen
      - run: docker compose config --quiet
      - run: docker build --load -f docker/Dockerfile -t lupabin-worker:0.11.0 .
      - run: uv run --frozen pytest -m docker
